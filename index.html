<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Daily Planner">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b2e47">
<title>Lars Norup's Daily Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f5f8;--surface:#fff;--surface-2:#f6f8fb;--text:#0f1b2a;--muted:#637085;--line:#e2e7ee;
  --brand:#0b2e47;--brand-2:#174e75;--brand-soft:#e5eef6;
  --act:#1f63b4;--act-soft:#e6f0fb;--mtg:#6a45c2;--mtg-soft:#efe9fb;--per:#1f7f58;--per-soft:#e3f4ec;
  --red:#cf3e3e;--red-soft:#fbe9e9;--amber:#b87400;--amber-soft:#fcf1dd;--green:#1f7f58;--green-soft:#e3f4ec;
  --shadow:0 1px 2px rgba(15,27,42,.05),0 6px 18px rgba(15,27,42,.05);
  --ring:0 0 0 3px rgba(31,99,180,.22);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0c131b;--surface:#141d28;--surface-2:#1a2532;--text:#e7edf4;--muted:#93a1b3;--line:#243142;
  --brand:#0a2236;--brand-2:#5ea3dc;--brand-soft:#1b2c3e;
  --act:#6aa8ec;--act-soft:#16293d;--mtg:#a98bf0;--mtg-soft:#231c38;--per:#5cc495;--per-soft:#14302a;
  --red:#ef7b7b;--red-soft:#3a1e22;--amber:#e6b052;--amber-soft:#352914;--green:#5cc495;--green-soft:#14302a;
  --shadow:0 1px 2px rgba(0,0,0,.3);--ring:0 0 0 3px rgba(106,168,236,.3);
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:Inter,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.ic{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:var(--brand);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 1px 0 rgba(255,255,255,.06)}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px;letter-spacing:-.1px}
.logo{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#2f7fc1,#6a45c2);display:grid;place-items:center}
.logo .ic{width:16px;height:16px;stroke:#fff;stroke-width:2.6}
.link{background:none;border:0;color:rgba(255,255,255,.8);cursor:pointer;font-size:14px;padding:6px 4px}
.link:hover{color:#fff}

main{max-width:860px;margin:0 auto;padding:16px 16px calc(110px + env(safe-area-inset-bottom))}
.crumbs{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:18px}
.crumbs a{color:var(--brand-2);text-decoration:none;font-weight:500}
.crumbs .sep{opacity:.5}
h1{font-size:27px;font-weight:700;letter-spacing:-.5px;margin:2px 0 2px;line-height:1.2}
.subtitle{color:var(--muted);font-size:14px;margin-bottom:6px}

/* grouped lists */
.group{margin:20px 0}
.glabel{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);margin:0 4px 8px}
.glist{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.grow{display:flex;align-items:center;gap:12px;padding:13px 16px;text-decoration:none;color:var(--text);border:0;border-top:1px solid var(--line);background:none;width:100%;font-size:16px;cursor:pointer;text-align:left}
.glist>.grow:first-child{border-top:0}
.grow:hover{background:var(--surface-2)}
.gname{flex:1;font-weight:500}
.gicon{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand-2);font-weight:700;font-size:14px;flex:none}
.gicon.all{background:linear-gradient(135deg,#2f7fc1,#6a45c2);color:#fff}
.gicon.trash{background:var(--surface-2);color:var(--muted)}
.count{min-width:26px;padding:2px 9px;border-radius:999px;background:var(--brand-soft);color:var(--brand-2);font-size:13px;font-weight:600;text-align:center}
.count.zero{background:transparent;color:var(--muted)}
.chev{color:var(--muted)}
.grow.add{color:var(--brand-2);font-weight:600;font-size:15px}
.grow.add .gicon{background:transparent;border:1.5px dashed var(--line)}

/* segmented control + toolbar */
.seg{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:3px;margin:16px 0 12px}
.seg button{border:0;background:none;border-radius:9px;padding:9px 0;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer;transition:background .15s,color .15s}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(15,27,42,.12)}
.seg button[data-s=actions].on{color:var(--act)}.seg button[data-s=meetings].on{color:var(--mtg)}.seg button[data-s=people].on{color:var(--per)}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chips{display:flex;gap:6px}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:14px;font-weight:500;color:var(--muted);cursor:pointer}
.chips button.on{background:var(--text);border-color:var(--text);color:var(--surface)}
.search{flex:1;min-width:180px;position:relative}
.search .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search input{padding-left:36px;border-radius:999px}

/* form controls */
input,select,textarea{font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--text);width:100%;outline:none;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--brand-2);box-shadow:var(--ring)}
input[type=checkbox]{width:18px;height:18px;padding:0;margin:0;flex:none;accent-color:var(--accent,var(--brand-2));cursor:pointer;box-shadow:none}
textarea{resize:vertical}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:9px;padding:7px 12px;font-size:14px;font-weight:500;cursor:pointer;line-height:1.2;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--brand-2);border-color:var(--brand-2);color:#fff}
.btn.primary:hover{filter:brightness(1.08);background:var(--brand-2)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--surface-2);color:var(--text)}
.btn.danger{color:var(--red)}
.btn .ic{width:15px;height:15px}
.ib{width:30px;height:30px;border-radius:8px;border:0;background:transparent;color:var(--muted);display:inline-grid;place-items:center;cursor:pointer;flex:none}
.ib:hover{background:var(--surface-2);color:var(--text)}
.ib .ic{width:15px;height:15px}

/* cards */
.card{--accent:var(--act);--accent-soft:var(--act-soft);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px 12px 18px;margin:10px 0;box-shadow:var(--shadow);position:relative}
.card::before{content:'';position:absolute;left:0;top:12px;bottom:12px;width:4px;border-radius:0 4px 4px 0;background:var(--accent)}
.k-meeting{--accent:var(--mtg);--accent-soft:var(--mtg-soft)}
.k-person{--accent:var(--per);--accent-soft:var(--per-soft)}
.k-trash{--accent:var(--line);--accent-soft:var(--surface-2)}
.card.done{opacity:.62}.card.done .ttl{text-decoration:line-through}
.ctop{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:4px}
.chip{font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.where{font-weight:600;text-transform:uppercase;font-size:11px;letter-spacing:.5px}
.due{margin-left:auto;font-weight:600;display:inline-flex;align-items:center;gap:5px;font-size:12.5px}
.due .ic{width:13px;height:13px}
.due.late{color:var(--red)}.due.today{color:var(--amber)}
.ttl{font-size:16.5px;font-weight:600;margin:0;line-height:1.35;letter-spacing:-.15px}
.sub{font-size:13px;color:var(--muted);margin-top:2px;display:flex;align-items:center;gap:5px}
.sub .ic{width:13px;height:13px}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.pill{font-size:12px;font-weight:500;padding:3px 9px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);display:inline-flex;gap:5px;align-items:center}
.pill .ic{width:12px;height:12px}
.pill.hi{background:var(--red-soft);color:var(--red);border-color:transparent}
.pill.wait{background:var(--amber-soft);color:var(--amber);border-color:transparent}
.pill.deleg{background:var(--act-soft);color:var(--act);border-color:transparent}
.pill.yes{background:var(--green-soft);color:var(--green);border-color:transparent}
.pill.no{background:var(--amber-soft);color:var(--amber);border-color:transparent}
.when{display:flex;align-items:center;gap:6px;font-weight:600;color:var(--mtg);font-size:14px;margin-top:4px}
.when .ic{width:15px;height:15px}
.cl{list-style:none;margin:10px 0 0;padding:0;border-top:1px solid var(--line)}
.cl li{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--line)}
.cl li:last-child{border-bottom:0}
.cl .lab{flex:1;display:flex;align-items:center;gap:10px;cursor:pointer;min-height:28px}
.cl .num{font-size:12px;font-weight:700;color:var(--accent);min-width:16px;text-align:right}
.cl .x{text-decoration:line-through;color:var(--muted)}
.cl .ctl{display:flex;gap:0}
.notes{margin-top:10px;font-size:14px;background:var(--surface-2);border-radius:10px;padding:8px 11px;white-space:pre-wrap;color:var(--text)}
.cact{display:flex;gap:4px;margin-top:10px;flex-wrap:wrap;align-items:center}
.cact .end{margin-left:auto}
.phead{display:flex;align-items:center;gap:12px}
.av{width:38px;height:38px;border-radius:50%;background:var(--per-soft);color:var(--per);font-weight:700;display:grid;place-items:center;font-size:14px;flex:none}
.phead .ttl{flex:1}
.pmeta{font-size:13px;color:var(--muted)}
.pblock{margin-top:10px}
.pblock+.pblock{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
.addrow{display:flex;gap:6px;margin-top:8px}
.addrow input{padding:8px 11px;font-size:15px}
.empty{text-align:center;color:var(--muted);padding:26px 14px;border:1.5px dashed var(--line);border-radius:14px;margin:12px 0;font-size:14px}
.sechead{display:flex;align-items:center;gap:8px;margin:20px 2px 4px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.7px;color:var(--muted)}
.upc{display:flex;align-items:center;gap:8px;width:100%;margin:10px 0;padding:11px 16px;border-radius:12px;border:1px solid var(--line);background:var(--mtg-soft);color:var(--mtg);font-weight:600;font-size:14px;cursor:pointer}
.upc .chev{margin-left:auto;color:var(--mtg)}

/* FAB */
.fab{position:fixed;right:max(18px,calc(50% - 412px));bottom:calc(20px + env(safe-area-inset-bottom));z-index:30;display:flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:14px 20px 14px 16px;font-size:15px;font-weight:600;color:#fff;background:var(--fab,var(--act));box-shadow:0 8px 24px rgba(15,27,42,.25);cursor:pointer}
.fab .ic{width:20px;height:20px;stroke-width:2.4}
.fab[hidden]{display:none}

/* sheet / dialog */
.sheet{position:fixed;inset:0;z-index:50;display:none}
.sheet.open{display:block}
.backdrop{position:absolute;inset:0;background:rgba(8,16,26,.45);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.panel{--accent:var(--act);position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(580px,calc(100% - 32px));max-height:calc(100vh - 48px);display:flex;flex-direction:column;background:var(--surface);border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.3);overflow:hidden;border-top:4px solid var(--accent)}
.panel.meeting{--accent:var(--mtg)}.panel.person{--accent:var(--per)}
.ph{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 6px 20px}
.ph h2{margin:0;font-size:18px;font-weight:700;letter-spacing:-.2px}
.pb{overflow:auto;padding:8px 20px 16px;display:grid;gap:12px}
.pf{display:flex;gap:8px;align-items:center;padding:12px 20px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--surface-2)}
.pf .sp{flex:1}
.f{display:grid;gap:5px}
.f>span{font-size:12.5px;font-weight:600;color:var(--muted)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.only-meeting{display:none}
.panel.meeting .only-meeting{display:grid}
.panel.meeting .only-action,.panel.person .only-action,.panel.person .no-person{display:none}
.it{display:flex;gap:4px;align-items:center;margin-bottom:6px}
.it input:not([type=checkbox]){padding:8px 10px;font-size:15px}
.it input[type=checkbox]{margin:0 6px 0 2px}
.addit{display:flex;gap:6px}
@media (max-width:640px){
  h1{font-size:24px}
  .panel{left:0;right:0;bottom:0;top:auto;transform:none;width:100%;max-height:92vh;border-radius:20px 20px 0 0}
  .g2{grid-template-columns:1fr}
  .seg button{font-size:13px}
  .cact .lbl-hide{display:none}
}

/* login */
.login{max-width:400px;margin:10vh auto 0;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:30px 26px;box-shadow:var(--shadow)}
.login .logo{width:44px;height:44px;border-radius:12px;margin-bottom:16px}
.login .logo .ic{width:24px;height:24px}
.login h2{margin:0 0 4px;font-size:22px;letter-spacing:-.3px}
.login p{color:var(--muted);margin:0 0 18px}
.login .btn{width:100%;justify-content:center;padding:11px;margin-top:10px;font-size:15px}
#msg{margin-top:12px;font-size:14px;color:var(--muted)}
</style>
</head>
<body>
<header class="top">
 <div class="brand"><span class="logo"><svg class="ic" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></span>Lars Norup's Daily Planner</div>
 <button id="who" class="link" hidden onclick="logout()">Log ud</button>
</header>
<main>
 <section id="login" class="login" style="display:none">
  <div class="logo"><svg class="ic" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></div>
  <h2>Log ind</h2>
  <p>Skriv din e-mail, så sender vi dig et login-link.</p>
  <input id="email" type="email" placeholder="din@mail.dk" autocomplete="email">
  <button class="btn primary" onclick="login()">Send login-link</button>
  <div id="msg"></div>
 </section>
 <section id="app" style="display:none">
  <nav id="crumbs" class="crumbs"></nav>
  <h1 id="h1"></h1>
  <div id="subtitle" class="subtitle"></div>
  <div id="lists"></div>
  <div id="acts">
   <div class="seg">
    <button data-s="all" class="on">Alt</button><button data-s="actions">Actions</button><button data-s="meetings">Møder</button><button data-s="people">Afklar med</button>
   </div>
   <div class="toolbar">
    <div class="chips"><button data-v="today" class="on">I dag</button><button data-v="all">Alle</button><button data-v="done">Færdige</button></div>
    <div class="search"><svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg><input id="q" type="search" placeholder="Søg"></div>
   </div>
   <div id="list"></div>
  </div>
 </section>
</main>

<button id="fab" class="fab" hidden onclick="fabAdd()"><svg class="ic" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span id="fabLbl">Ny</span></button>

<div id="sheet" class="sheet">
 <div class="backdrop" onclick="closeForm()"></div>
 <form id="form" class="panel" onsubmit="save(event)">
  <div class="ph"><h2 id="formHead"></h2><button type="button" class="ib" onclick="closeForm()" aria-label="Luk"><svg class="ic" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
  <div class="pb">
   <label class="f"><span id="titleLbl">Action</span><input id="title" required></label>
   <label class="f" id="projWrap"><span>Projekt</span><select id="project_id" onchange="fillParents()"></select></label>
   <div class="g2 only-meeting">
    <label class="f"><span>Tidspunkt</span><input id="meeting_at" type="datetime-local"></label>
    <label class="f"><span>Indkaldelse</span><select id="invited"><option value="0">Ikke indkaldt</option><option value="1">Indkaldt</option></select></label>
   </div>
   <label class="f only-action"><span>Opfølgning på</span><select id="parent_id"></select></label>
   <label class="f no-person"><span id="concernsLbl">Vedrører</span><input id="concerns"></label>
   <div class="g2 only-action">
    <label class="f"><span>Prioritet</span><select id="priority"><option value="1">Høj</option><option value="2" selected>Mellem</option><option value="3">Lav</option></select></label>
    <label class="f"><span>Deadline</span><input id="due" type="date"></label>
   </div>
   <div class="g2 only-action">
    <label class="f"><span>Delegeret til</span><input id="delegated_to" placeholder="Navn"></label>
    <label class="f"><span>Status</span><select id="status"><option value="open">Åben</option><option value="waiting">Venter</option><option value="delegated">Delegeret</option><option value="done">Færdig</option></select></label>
   </div>
   <div class="f"><span id="itemsLbl">Punkter</span>
    <div id="items"></div>
    <div class="addit"><input id="newItem" placeholder="Skriv og tryk Enter"><button type="button" class="btn" onclick="itAdd()">Tilføj</button></div>
   </div>
   <label class="f"><span>Noter</span><textarea id="notes" rows="3"></textarea></label>
  </div>
  <div class="pf">
   <button type="button" class="btn ghost danger" id="delBtn" onclick="del()"><svg class="ic" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>Slet</button>
   <span class="sp"></span>
   <button type="button" class="btn ghost" onclick="closeForm()">Annullér</button>
   <button class="btn primary">Gem</button>
  </div>
 </form>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const SUPABASE_URL = 'https://dvxdbixgjaxoggycbiuy.supabase.co';
const SUPABASE_KEY = 'sb_publishable_e7bd-WjT0m1iQlH2j5bZ3g_rvGNhllR';
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

let C = [], P = [], A = [], ALL = [], view = 'today', sec = 'all', editId = null, parentId = null, channel = null;
let kind = 'action', items = [], formBin = [], refocus = null;
const $ = id => document.getElementById(id);
const F = ['title','project_id','concerns','delegated_to','priority','due','status','notes'];
const KIND = { action: 'Action', meeting: 'Møde', person: 'Afklar med' };
const today = () => new Date().toLocaleDateString('sv-SE');
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cust = id => C.find(c => c.id === id);
const proj = id => P.find(p => p.id === id);
const byId = id => A.find(x => x.id === id);
const isOpen = a => a.status !== 'done';
const isMtg = a => a.kind === 'meeting';
const isPer = a => a.kind === 'person';
const counted = a => isOpen(a) && !isPer(a);
const binCount = () => ALL.filter(x => x.deleted_at).length + A.reduce((n, x) => n + x.binned.length, 0);
const projIdsOf = cid => new Set(P.filter(p => p.customer_id === cid).map(p => p.id));
const route = () => { const h = location.hash.replace(/^#\/?/, '').split('/'); return { k: h[0] || 'home', id: h[1], sub: h[2] }; };
const localDay = iso => iso ? new Date(iso).toLocaleDateString('sv-SE') : null;
const toLocalInput = iso => { if (!iso) return ''; const d = new Date(iso); return new Date(d - d.getTimezoneOffset() * 60000).toISOString().slice(0, 16); };
const fmtWhen = iso => iso ? new Date(iso).toLocaleString('da-DK', { weekday:'short', day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' }) : 'Intet tidspunkt';
const fmtDay = d => new Date(d + 'T12:00').toLocaleDateString('da-DK', { day:'numeric', month:'short' });
const initials = s => s.trim().split(/\s+/).slice(0, 2).map(w => w[0] || '').join('').toUpperCase();

const PATHS = {
  check:'<path d="M20 6 9 17l-5-5"/>', plus:'<path d="M12 5v14M5 12h14"/>',
  edit:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>',
  trash:'<path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/>', up:'<path d="m18 15-6-6-6 6"/>', down:'<path d="m6 9 6 6 6-6"/>',
  x:'<path d="M18 6 6 18M6 6l12 12"/>', cal:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>', chev:'<path d="m9 18 6-6-6-6"/>',
  branch:'<circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M6 8.5V13a5 5 0 0 0 5 5h4.5"/>',
  arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>', clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  undo:'<path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/>', flag:'<path d="M4 22V4M4 4h13l-2 4 2 4H4"/>',
  broom:'<path d="M3 21 12 12M14 4l6 6-5 5-6-6Z"/>'
};
const I = (n, cls = '') => `<svg class="ic ${cls}" viewBox="0 0 24 24">${PATHS[n]}</svg>`;

window.login = async () => {
  const { error } = await sb.auth.signInWithOtp({ email: $('email').value, options:{ emailRedirectTo: location.origin + location.pathname } });
  $('msg').textContent = error ? error.message : 'Tjek din mail for login-linket.';
};

async function load(){
  const [c, p, a] = await Promise.all([
    sb.from('customers').select('*').order('name'),
    sb.from('projects').select('*').order('name'),
    sb.from('actions').select('*').order('priority').order('due', { nullsFirst:false })
  ]);
  const err = c.error || p.error || a.error;
  if (err) { $('lists').style.display = 'block'; $('lists').innerHTML = `<div class="empty">Fejl: ${esc(err.message)}</div>`; return; }
  C = c.data; P = p.data;
  ALL = a.data.map(x => ({ ...x, items: Array.isArray(x.items) ? x.items : [], binned: Array.isArray(x.binned) ? x.binned : [] }));
  A = ALL.filter(x => !x.deleted_at); render();
}

function label(a){
  const p = proj(a.project_id); if (!p) return 'Uden projekt';
  const c = cust(p.customer_id); return (c ? c.name + ' · ' : '') + p.name;
}

function scope(r){
  if (r.k === 'p') return { acts: A.filter(a => a.project_id === r.id), projs: P.filter(p => p.id === r.id), fixed: r.id };
  if (r.k === 'c') { const ids = projIdsOf(r.id); return { acts: A.filter(a => ids.has(a.project_id)), projs: P.filter(p => ids.has(p.id)) }; }
  return { acts: A, projs: P };
}

// ---------- header: crumbs + title ----------
function heading(r){
  const crumb = [], link = (h, t) => crumb.push(`<a href="${h}">${esc(t)}</a>`);
  let title = 'Mine kunder', sub = '';
  if (r.k === 'home') {
    const d = new Date().toLocaleDateString('da-DK', { weekday:'long', day:'numeric', month:'long' });
    sub = d.charAt(0).toUpperCase() + d.slice(1);
  } else link('#', 'Kunder');
  if (r.k === 'all') title = 'Alt på tværs';
  if (r.k === 'trash') title = 'Papirkurv';
  if (r.k === 'c') {
    const c = cust(r.id);
    if (r.sub === 'all') { link('#c/' + r.id, c?.name); title = 'Alt for ' + (c?.name || ''); }
    else title = c?.name || '';
  }
  if (r.k === 'p') {
    const p = proj(r.id), c = p && cust(p.customer_id);
    if (c) link('#c/' + c.id, c.name);
    title = p?.name || '';
  }
  $('crumbs').innerHTML = crumb.join('<span class="sep">›</span>');
  $('h1').textContent = title;
  $('subtitle').textContent = sub;
  $('subtitle').style.display = sub ? '' : 'none';
}

// ---------- list pages ----------
const grow = (href, name, n, icon, cls = '') =>
  `<a class="grow" href="${href}"><span class="gicon ${cls}">${icon}</span><span class="gname">${esc(name)}</span>` +
  `<span class="count ${n ? '' : 'zero'}">${n}</span>${I('chev', 'chev')}</a>`;
const addRow = (onclick, text) => `<button class="grow add" onclick="${onclick}"><span class="gicon">${I('plus')}</span><span class="gname">${text}</span></button>`;
const group = (lbl, inner) => `<div class="group">${lbl ? `<div class="glabel">${lbl}</div>` : ''}<div class="glist">${inner}</div></div>`;

function render(){
  const r = route(); heading(r);
  const isList = r.k === 'home' || r.k === 'trash' || (r.k === 'c' && r.sub !== 'all');
  $('lists').style.display = isList ? 'block' : 'none';
  $('acts').style.display = isList ? 'none' : 'block';
  if (isList) $('fab').hidden = true;
  if (r.k === 'home') {
    $('lists').innerHTML =
      group('Overblik', grow('#all', 'Alt på tværs', A.filter(counted).length, I('check'), 'all')) +
      group('Kunder', C.map(c => { const ids = projIdsOf(c.id); return grow('#c/' + c.id, c.name, A.filter(a => counted(a) && ids.has(a.project_id)).length, esc(initials(c.name))); }).join('') +
        addRow('newCustomer()', 'Ny kunde')) +
      group('', grow('#trash', 'Papirkurv', binCount(), I('trash'), 'trash'));
  } else if (r.k === 'trash') {
    renderTrash();
  } else if (isList) {
    const c = cust(r.id); if (!c) { location.hash = ''; return; }
    const ps = P.filter(p => p.customer_id === c.id), ids = new Set(ps.map(p => p.id));
    $('lists').innerHTML =
      group('Overblik', grow(`#c/${c.id}/all`, `Alt for ${c.name}`, A.filter(a => counted(a) && ids.has(a.project_id)).length, I('check'), 'all')) +
      group('Projekter', ps.map(p => grow('#p/' + p.id, p.name, A.filter(a => counted(a) && a.project_id === p.id).length, esc(initials(p.name)))).join('') +
        addRow(`newProject('${c.id}')`, 'Nyt projekt'));
  } else renderActs(r);
}

function renderTrash(){
  const rows = ALL.filter(x => x.deleted_at).sort((x, y) => y.deleted_at.localeCompare(x.deleted_at));
  const its = A.flatMap(a => a.binned.map((it, i) => ({ a, it, i }))).sort((x, y) => (y.it.del || '').localeCompare(x.it.del || ''));
  const when = iso => iso ? new Date(iso).toLocaleString('da-DK', { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' }) : '';
  const tcard = (top, title, meta, restoreCall, purgeCall) => `<div class="card k-trash">
      <div class="ctop"><span class="where">${top}</span></div><div class="ttl">${title}</div><div class="sub">${meta}</div>
      <div class="cact"><button class="btn primary" onclick="${restoreCall}">${I('undo')}Gendan</button><button class="btn ghost danger" onclick="${purgeCall}">Slet permanent</button></div></div>`;
  $('lists').innerHTML =
    `<div class="sechead">Slettede actions, møder og personer</div>` +
    (rows.map(x => tcard(`${KIND[x.kind] || 'Action'} · ${esc(label(x))}`, esc(x.title),
      `Slettet ${when(x.deleted_at)}${x.items.length ? ` · ${x.items.length} punkter` : ''}`, `restore('${x.id}')`, `purge('${x.id}')`)).join('')
      || '<div class="empty">Ingen slettede actions, møder eller personer.</div>') +
    `<div class="sechead">Slettede punkter</div>` +
    (its.map(({ a, it, i }) => tcard(`${KIND[a.kind] || 'Action'}: ${esc(a.title)} · ${esc(label(a))}`, esc(it.t),
      `Slettet ${when(it.del)}`, `itemRestore('${a.id}',${i})`, `itemPurge('${a.id}',${i})`)).join('')
      || '<div class="empty">Ingen slettede punkter.</div>') +
    (rows.length || its.length ? `<div class="cact" style="margin-top:16px"><button class="btn danger" onclick="emptyTrash()">${I('trash')}Tøm papirkurven</button></div>` : '');
}

// ---------- cards ----------
function checklist(a){
  if (!a.items.length) return '';
  return `<ul class="cl">` + a.items.map((it, i) => `<li>
    <label class="lab"><input type="checkbox" ${it.done ? 'checked' : ''} onchange="tick('${a.id}',${i})">` +
    (isMtg(a) ? `<span class="num">${i + 1}</span>` : '') +
    `<span class="${it.done ? 'x' : ''}">${esc(it.t)}</span></label>` +
    `<button class="ib" title="Slet punkt" onclick="pDel('${a.id}',${i})">${I('x')}</button></li>`).join('') + `</ul>`;
}

function topLine(chip, where, right){
  if (!chip && !where && !right) return '';
  return `<div class="ctop">${chip ? `<span class="chip">${chip}</span>` : ''}${where ? `<span class="where">${esc(where)}</span>` : ''}${right || ''}</div>`;
}

function actCard(a, o){
  const t = today(), late = a.due && a.due < t && isOpen(a), isT = a.due === t;
  const due = a.due ? `<span class="due ${late ? 'late' : isT ? 'today' : ''}">${I('cal')}${isT ? 'I dag' : fmtDay(a.due)}</span>` : '';
  const par = a.parent_id && !o.inTree?.has(a.parent_id) ? A.find(x => x.id === a.parent_id) : null;
  const pills = [];
  if (a.priority == 1) pills.push(`<span class="pill hi">${I('flag')}Høj</span>`);
  if (a.priority == 3) pills.push(`<span class="pill">Lav</span>`);
  if (a.status === 'waiting') pills.push(`<span class="pill wait">${I('clock')}Venter</span>`);
  if (a.delegated_to) pills.push(`<span class="pill deleg">${I('arrow')}${esc(a.delegated_to)}</span>`);
  if (a.concerns) pills.push(`<span class="pill">${I('user')}${esc(a.concerns)}</span>`);
  if (a.items.length) pills.push(`<span class="pill">${I('check')}${a.items.filter(i => i.done).length}/${a.items.length}</span>`);
  return `<div class="card k-action ${isOpen(a) ? '' : 'done'}" style="margin-left:${Math.min(o.depth || 0, 3) * 20}px">
    ${topLine(o.chip ? 'Action' : '', o.where ? label(a) : '', due)}
    <div class="ttl">${esc(a.title)}</div>
    ${par ? `<div class="sub">${I('branch')}Fra ${isMtg(par) ? 'møde' : 'action'}: ${esc(par.title)}</div>` : ''}
    ${pills.length ? `<div class="pills">${pills.join('')}</div>` : ''}
    ${checklist(a)}
    ${a.notes ? `<div class="notes">${esc(a.notes)}</div>` : ''}
    <div class="cact">
      ${isOpen(a) ? `<button class="btn" onclick="done('${a.id}')">${I('check')}Færdig</button>` : `<button class="btn" onclick="reopen('${a.id}')">${I('undo')}Genåbn</button>`}
      <button class="btn ghost" onclick="followUp('${a.id}')">${I('branch')}<span class="lbl-hide">Opfølgning</span></button>
      <button class="btn ghost" onclick="edit('${a.id}')">${I('edit')}<span class="lbl-hide">Ret</span></button>
      <button class="ib end" title="Slet" onclick="trash('${a.id}')">${I('trash')}</button>
    </div></div>`;
}

function mtgCard(a, o){
  const pills = [`<span class="pill ${a.invited ? 'yes' : 'no'}">${a.invited ? 'Indkaldt' : 'Ikke indkaldt'}</span>`];
  if (a.concerns) pills.push(`<span class="pill">${I('user')}${esc(a.concerns)}</span>`);
  return `<div class="card k-meeting ${isOpen(a) ? '' : 'done'}">
    ${topLine(o.chip ? 'Møde' : '', o.where ? label(a) : '', '')}
    <div class="ttl">${esc(a.title)}</div>
    <div class="when">${I('cal')}${fmtWhen(a.meeting_at)}</div>
    <div class="pills">${pills.join('')}</div>
    ${checklist(a)}
    ${a.notes ? `<div class="notes">${esc(a.notes)}</div>` : ''}
    <div class="cact">
      ${isOpen(a) ? `<button class="btn" onclick="done('${a.id}')">${I('check')}Afholdt</button>` : `<button class="btn" onclick="reopen('${a.id}')">${I('undo')}Genåbn</button>`}
      <button class="btn ghost" onclick="followUp('${a.id}')">${I('plus')}<span class="lbl-hide">Action</span></button>
      <button class="btn ghost" onclick="edit('${a.id}')">${I('edit')}<span class="lbl-hide">Ret</span></button>
      <button class="ib end" title="Slet" onclick="trash('${a.id}')">${I('trash')}</button>
    </div></div>`;
}

function perCard(rows, o){
  const all = rows.flatMap(r => r.items), open = all.filter(i => !i.done).length;
  const block = r => `<div class="pblock">
    ${o.where ? `<div class="ctop"><span class="where">${esc(label(r))}</span></div>` : ''}
    ${r.items.length ? `<ul class="cl">${r.items.map((it, i) => `<li>
      <label class="lab"><input type="checkbox" ${it.done ? 'checked' : ''} onchange="tick('${r.id}',${i})"><span class="${it.done ? 'x' : ''}">${esc(it.t)}</span></label>
      <span class="ctl"><button class="ib" title="Op" onclick="pMove('${r.id}',${i},-1)">${I('up')}</button><button class="ib" title="Ned" onclick="pMove('${r.id}',${i},1)">${I('down')}</button><button class="ib" title="Slet" onclick="pDel('${r.id}',${i})">${I('x')}</button></span>
      </li>`).join('')}</ul>` : ''}
    <div class="addrow"><input id="pi_${r.id}" placeholder="Nyt emne at afklare" onkeydown="if(event.key==='Enter')pAdd('${r.id}')"><button class="btn" onclick="pAdd('${r.id}')">${I('plus')}</button></div>
    <div class="cact">
      ${r.items.some(i => i.done) ? `<button class="btn ghost" onclick="pClear('${r.id}')">${I('broom')}Ryd afklarede</button>` : ''}
      <button class="btn ghost" onclick="edit('${r.id}')">${I('edit')}<span class="lbl-hide">Ret</span></button>
      <button class="ib end" title="Slet" onclick="trash('${r.id}')">${I('trash')}</button>
    </div></div>`;
  return `<div class="card k-person">
    ${o.chip ? topLine('Afklar med', '', '') : ''}
    <div class="phead"><span class="av">${esc(initials(rows[0].title))}</span><div class="ttl">${esc(rows[0].title)}</div>
    <span class="pmeta">${open} ${open === 1 ? 'åbent emne' : 'åbne emner'}</span></div>
    ${rows.map(block).join('')}</div>`;
}

function personGroups(acts){
  const g = {};
  acts.filter(isPer).forEach(a => { const k = a.title.trim().toLowerCase(); (g[k] ||= []).push(a); });
  return Object.keys(g).sort((x, y) => x.localeCompare(y, 'da')).map(k => g[k]);
}

// ---------- the main list ----------
function renderActs(r){
  const s = scope(r), t = today(), q = $('q').value.trim().toLowerCase();
  const match = a => !q || [a.title, a.concerns, a.notes, a.delegated_to, label(a), ...a.items.map(i => i.t)].join(' ').toLowerCase().includes(q);
  const where = !s.fixed;
  document.querySelectorAll('.chips [data-v]').forEach(b => b.style.display = sec === 'people' ? 'none' : '');
  const fab = { actions:['Ny action','var(--act)'], meetings:['Nyt møde','var(--mtg)'], people:['Ny person','var(--per)'] }[sec];
  $('fab').hidden = !fab;
  if (fab) { $('fabLbl').textContent = fab[0]; $('fab').style.setProperty('--fab', fab[1]); }

  const keep = {}; document.querySelectorAll('[id^=pi_]').forEach(x => keep[x.id] = x.value);
  const focused = document.activeElement?.id;
  const pool = s.acts.filter(match);

  // meetings
  let ms = pool.filter(isMtg), upcoming = 0;
  ms = view === 'done' ? ms.filter(a => !isOpen(a)) : ms.filter(isOpen);
  if (view === 'today') {
    upcoming = ms.filter(a => a.meeting_at && localDay(a.meeting_at) > t).length;
    ms = ms.filter(a => !a.meeting_at || localDay(a.meeting_at) <= t);
  }
  ms.sort((x, y) => (x.meeting_at || '9999').localeCompare(y.meeting_at || '9999') * (view === 'done' ? -1 : 1));
  const upc = upcoming ? `<button class="upc" onclick="showAll()">${I('cal')}${upcoming} kommende ${upcoming === 1 ? 'møde' : 'møder'}${I('chev', 'chev')}</button>` : '';

  // actions
  let list = pool.filter(a => !isMtg(a) && !isPer(a));
  list = view === 'done' ? list.filter(a => !isOpen(a)) : list.filter(isOpen);
  if (view === 'today') list = list.filter(a => !a.due || a.due <= t || a.priority == 1);

  // people
  const people = personGroups(pool).filter(rows => sec === 'people' || (view !== 'done' && rows.some(r => r.items.some(i => !i.done))));

  let html = '';
  if (sec === 'people') {
    html = people.map(rows => perCard(rows, { where })).join('') || '<div class="empty">Ingen personer endnu. Tryk “Ny person”.</div>';
  } else if (sec === 'meetings') {
    html = (ms.map(a => mtgCard(a, { where })).join('') || `<div class="empty">${view === 'today' ? 'Ingen møder i dag.' : 'Ingen møder.'}</div>`) + upc;
  } else if (sec === 'actions') {
    const ids = new Set(list.map(a => a.id)), seen = new Set();
    const tree = (a, d) => seen.has(a.id) ? '' : (seen.add(a.id), actCard(a, { depth: d, where, inTree: ids }) + list.filter(x => x.parent_id === a.id).map(x => tree(x, d + 1)).join(''));
    html = list.filter(a => !a.parent_id || !ids.has(a.parent_id)).map(a => tree(a, 0)).join('') || '<div class="empty">Ingen actions her.</div>';
  } else {
    const key = a => isMtg(a) ? (a.meeting_at ? toLocalInput(a.meeting_at) : null) : (a.due ? a.due + 'T23:59' : null);
    const mixed = [...ms, ...list].sort((x, y) => {
      const kx = key(x), ky = key(y);
      if (kx && ky && kx !== ky) return kx.localeCompare(ky) * (view === 'done' ? -1 : 1);
      if (kx && !ky) return -1; if (!kx && ky) return 1;
      return (x.priority || 2) - (y.priority || 2);
    });
    html = mixed.map(a => isMtg(a) ? mtgCard(a, { chip: true, where }) : actCard(a, { chip: true, where })).join('') +
      people.map(rows => perCard(rows, { chip: true, where })).join('') + upc;
    if (!mixed.length && !people.length) html = `<div class="empty">${view === 'today' ? 'Intet på programmet i dag.' : 'Intet her.'}</div>` + upc;
  }
  $('list').innerHTML = html;

  Object.entries(keep).forEach(([id, v]) => { const el = $(id); if (el) el.value = v; });
  const f = refocus ? 'pi_' + refocus : focused;
  if (f && f.startsWith('pi_') && $(f)) $(f).focus();
  refocus = null;
}

// ---------- create customers / projects ----------
window.newCustomer = async () => {
  const name = prompt('Navn på kunde'); if (!name) return;
  const { data, error } = await sb.from('customers').insert({ name }).select().single();
  if (error) return alert(error.message);
  C.push(data); location.hash = 'c/' + data.id;
};
window.newProject = async cid => {
  const name = prompt('Navn på projekt'); if (!name) return;
  const { data, error } = await sb.from('projects').insert({ name, customer_id: cid }).select().single();
  if (error) return alert(error.message);
  P.push(data); location.hash = 'p/' + data.id;
};

// ---------- item editor in the form ----------
function drawItems(){
  $('items').innerHTML = items.map((it, i) => `<div class="it">
    <input type="checkbox" ${it.done ? 'checked' : ''} onchange="itToggle(${i})">
    <input value="${esc(it.t)}" oninput="itEdit(${i}, this.value)">
    <button type="button" class="ib" onclick="itMove(${i},-1)" title="Op">${I('up')}</button>
    <button type="button" class="ib" onclick="itMove(${i},1)" title="Ned">${I('down')}</button>
    <button type="button" class="ib" onclick="itDel(${i})" title="Fjern">${I('x')}</button></div>`).join('');
}
window.itAdd = () => { const v = $('newItem').value.trim(); if (!v) return; items.push({ t: v, done: false }); $('newItem').value = ''; drawItems(); $('newItem').focus(); };
window.itDel = i => { const [it] = items.splice(i, 1); if (it?.t?.trim()) formBin.push({ ...it, del: new Date().toISOString() }); drawItems(); };
window.itEdit = (i, v) => { items[i].t = v; };
window.itToggle = i => { items[i].done = !items[i].done; };
window.itMove = (i, d) => { const j = i + d; if (j < 0 || j >= items.length) return; [items[i], items[j]] = [items[j], items[i]]; drawItems(); };
$('newItem').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); itAdd(); } });

// ---------- inline item actions on cards ----------
async function saveItems(a){
  render();
  const { error } = await sb.from('actions').update({ items: a.items, binned: a.binned }).eq('id', a.id);
  if (error) { alert('Kunne ikke gemme: ' + error.message); load(); }
}
window.tick = (id, i) => { const a = byId(id); if (!a) return; a.items = a.items.map((it, k) => k === i ? { ...it, done: !it.done } : it); saveItems(a); };
window.pAdd = id => {
  const el = $('pi_' + id), v = el.value.trim(); if (!v) return;
  const a = byId(id); a.items = [...a.items, { t: v, done: false }]; el.value = ''; refocus = id; saveItems(a);
};
window.pMove = (id, i, d) => {
  const a = byId(id), j = i + d; if (j < 0 || j >= a.items.length) return;
  const it = [...a.items]; [it[i], it[j]] = [it[j], it[i]]; a.items = it; saveItems(a);
};
window.pDel = (id, i) => {
  const a = byId(id), it = a.items[i]; if (!it) return;
  a.items = a.items.filter((_, k) => k !== i);
  a.binned = [...a.binned, { ...it, del: new Date().toISOString() }];
  saveItems(a);
};
window.pClear = id => {
  const a = byId(id), now = new Date().toISOString();
  a.binned = [...a.binned, ...a.items.filter(x => x.done).map(x => ({ ...x, del: now }))];
  a.items = a.items.filter(x => !x.done); saveItems(a);
};

// ---------- trash ----------
window.itemRestore = (id, i) => {
  const a = byId(id), it = a.binned[i]; if (!it) return;
  const { del: _, ...back } = it;
  a.binned = a.binned.filter((_, k) => k !== i); a.items = [...a.items, back]; saveItems(a);
};
window.itemPurge = (id, i) => {
  const a = byId(id); if (!confirm('Slet punktet permanent?')) return;
  a.binned = a.binned.filter((_, k) => k !== i); saveItems(a);
};
window.trash = async id => {
  const a = ALL.find(x => x.id === id); if (!a) return;
  a.deleted_at = new Date().toISOString(); A = ALL.filter(x => !x.deleted_at);
  if (editId === id) closeForm();
  render();
  const { error } = await sb.from('actions').update({ deleted_at: a.deleted_at }).eq('id', id);
  if (error) { alert('Kunne ikke slette: ' + error.message); load(); }
};
window.restore = async id => {
  const a = ALL.find(x => x.id === id); if (!a) return;
  a.deleted_at = null; A = ALL.filter(x => !x.deleted_at); render();
  const { error } = await sb.from('actions').update({ deleted_at: null }).eq('id', id);
  if (error) { alert('Kunne ikke gendanne: ' + error.message); load(); }
};
window.purge = async id => {
  if (!confirm('Slet permanent? Det kan ikke fortrydes.')) return;
  const { error } = await sb.from('actions').delete().eq('id', id);
  if (error) return alert('Kunne ikke slette: ' + error.message);
  load();
};
window.emptyTrash = async () => {
  if (!confirm('Tøm papirkurven? Alt i den slettes permanent.')) return;
  const ids = ALL.filter(x => x.deleted_at).map(x => x.id);
  const jobs = A.filter(x => x.binned.length).map(x => sb.from('actions').update({ binned: [] }).eq('id', x.id));
  if (ids.length) jobs.push(sb.from('actions').delete().in('id', ids));
  const res = await Promise.all(jobs), err = res.find(r => r.error);
  if (err) alert('Noget kunne ikke slettes: ' + err.error.message);
  load();
};
window.del = () => trash(editId);

// ---------- form ----------
window.fabAdd = () => openForm({}, { actions:'action', meetings:'meeting', people:'person' }[sec] || 'action');

window.openForm = (a = {}, k) => {
  const s = scope(route());
  if (!s.projs.length) return alert('Opret først en kunde og et projekt.');
  kind = a.kind || k || 'action';
  const m = kind === 'meeting', pe = kind === 'person';
  $('form').classList.toggle('meeting', m);
  $('form').classList.toggle('person', pe);
  $('formHead').textContent = a.id ? (m ? 'Ret møde' : pe ? 'Ret person' : 'Ret action')
    : (m ? 'Nyt møde' : pe ? 'Ny person at afklare med' : parentId ? 'Ny opfølgning' : 'Ny action');
  $('titleLbl').textContent = m ? 'Mødenavn' : pe ? 'Navn' : 'Action';
  $('concernsLbl').textContent = m ? 'Deltagere' : 'Vedrører (person/tema)';
  $('itemsLbl').textContent = m ? 'Agendapunkter' : pe ? 'Emner at afklare' : 'Punkter';
  $('delBtn').style.visibility = a.id ? 'visible' : 'hidden';
  $('project_id').innerHTML = '<option value="">Vælg projekt</option>' +
    s.projs.map(p => `<option value="${p.id}">${esc(label({ project_id: p.id }))}</option>`).join('');
  F.forEach(f => $(f).value = a[f] ?? (f === 'priority' ? 2 : f === 'status' ? 'open' : ''));
  $('project_id').value = a.project_id || s.fixed || (s.projs.length === 1 ? s.projs[0].id : '');
  $('projWrap').style.display = s.fixed ? 'none' : '';
  $('meeting_at').value = toLocalInput(a.meeting_at);
  $('invited').value = a.invited ? '1' : '0';
  items = (a.items || []).map(x => ({ ...x })); formBin = [];
  drawItems(); $('newItem').value = '';
  fillParents(a.parent_id || parentId || '');
  $('sheet').classList.add('open');
  document.body.style.overflow = 'hidden';
  setTimeout(() => $('title').focus(), 50);
};

function descendants(id){
  const out = new Set([id]); let added = true;
  while (added) { added = false;
    A.forEach(x => { if (x.parent_id && out.has(x.parent_id) && !out.has(x.id)) { out.add(x.id); added = true; } });
  }
  return out;
}
window.fillParents = (keep) => {
  const cur = keep ?? $('parent_id').value, pid = $('project_id').value;
  const banned = editId ? descendants(editId) : new Set();
  const opts = A.filter(x => x.project_id === pid && !isPer(x) && !banned.has(x.id) && (isOpen(x) || x.id === cur));
  $('parent_id').innerHTML = '<option value="">Ingen (selvstændig)</option>' +
    opts.map(x => `<option value="${x.id}">${isMtg(x) ? 'Møde: ' : ''}${esc(x.title)}</option>`).join('');
  $('parent_id').value = opts.some(x => x.id === cur) ? cur : '';
};
window.closeForm = () => { $('sheet').classList.remove('open'); document.body.style.overflow = ''; editId = parentId = null; };
window.edit = id => { editId = id; parentId = null; openForm(byId(id)); };
window.followUp = id => {
  const a = byId(id); parentId = id; editId = null;
  openForm({ project_id: a.project_id, concerns: isMtg(a) ? '' : a.concerns }, 'action');
};
window.done = async id => { await sb.from('actions').update({ status:'done', updated_at:new Date() }).eq('id', id); load(); };
window.reopen = async id => { await sb.from('actions').update({ status:'open', updated_at:new Date() }).eq('id', id); load(); };

window.save = async e => {
  e.preventDefault();
  if ($('newItem').value.trim()) itAdd();
  const v = {}; F.forEach(f => v[f] = $(f).value || null);
  if (!v.project_id) return alert('Vælg et projekt.');
  v.kind = kind;
  v.items = items.map(i => ({ t: i.t.trim(), done: !!i.done })).filter(i => i.t);
  v.binned = [...(editId ? byId(editId)?.binned || [] : []), ...formBin];
  if (kind === 'person') {
    Object.assign(v, { status: 'open', concerns: null, meeting_at: null, invited: false, parent_id: null, delegated_to: null, due: null, priority: 2 });
  } else if (kind === 'meeting') {
    v.meeting_at = $('meeting_at').value ? new Date($('meeting_at').value).toISOString() : null;
    v.invited = $('invited').value === '1';
    v.parent_id = null; v.delegated_to = null; v.due = null; v.priority = 2;
    if (!editId) v.status = 'open';
  } else {
    v.meeting_at = null; v.invited = false;
    v.parent_id = $('parent_id').value || null;
    v.priority = +v.priority || 2;
    if (v.delegated_to && v.status === 'open') v.status = 'delegated';
  }
  const res = editId
    ? await sb.from('actions').update({ ...v, updated_at:new Date() }).eq('id', editId)
    : await sb.from('actions').insert(v);
  if (res.error) return alert('Kunne ikke gemme: ' + res.error.message);
  closeForm(); load();
};

// ---------- wiring ----------
document.querySelectorAll('.chips [data-v]').forEach(b => b.onclick = () => {
  document.querySelectorAll('.chips [data-v]').forEach(x => x.classList.remove('on'));
  b.classList.add('on'); view = b.dataset.v; render();
});
document.querySelectorAll('.seg [data-s]').forEach(b => b.onclick = () => {
  document.querySelectorAll('.seg [data-s]').forEach(x => x.classList.remove('on'));
  b.classList.add('on'); sec = b.dataset.s; render();
});
window.showAll = () => document.querySelector('.chips [data-v=all]').click();
$('q').oninput = render;
window.addEventListener('hashchange', () => { closeForm(); $('q').value = ''; render(); window.scrollTo(0, 0); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('sheet').classList.contains('open')) closeForm(); });
window.logout = () => sb.auth.signOut();

sb.auth.onAuthStateChange((_, s) => {
  $('login').style.display = s ? 'none' : 'block';
  $('app').style.display = s ? 'block' : 'none';
  $('who').hidden = !s;
  if (!s) $('fab').hidden = true;
  if (s) {
    load();
    if (!channel) channel = sb.channel('db')
      .on('postgres_changes', { event:'*', schema:'public', table:'actions' }, load)
      .on('postgres_changes', { event:'*', schema:'public', table:'projects' }, load)
      .on('postgres_changes', { event:'*', schema:'public', table:'customers' }, load)
      .subscribe();
  }
});
</script>
</body>
</html>
